[project]
name = "birdie"
version = "0.1.0"
description = "Automated LoL highlights → Facebook compilation pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "obsws-python>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "types-requests"]

[project.scripts]
birdie = "birdie.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["birdie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["birdie"]
strict = true

[[tool.mypy.overrides]]
module = ["obsws_python.*"]
ignore_missing_imports = true
